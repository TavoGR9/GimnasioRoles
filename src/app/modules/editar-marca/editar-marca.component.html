
<ngx-spinner bdColor = "rgba(0, 0, 0, 0.8)" size = "medium" color = "#fff" type = "ball-pulse-sync" [fullScreen] = "true">
  <p style="color: white" > Cargando... </p>
</ngx-spinner>
<div class="title" mat-dialog-title>
   <label >SERVICIOS</label>
</div>
<div mat-dialog-content>
  <form [formGroup]="serviceForm" >
     <br>
     <div>
        <div style="color:red">{{message}}</div>
        <div >
           <div class="row">
              <div class="col-sm-12">
                 <mat-form-field appearance="outline" style="width: 95%;">
                    <mat-label>Nombre del servicio</mat-label>
                    <input matInput formControlName="marcaP" placeholder="Nombre del servicio" />
                    <mat-error >
                       El nombre es requerido.
                    </mat-error>
                    <mat-error >
                       Solo se aceptan letras.
                    </mat-error>
                 </mat-form-field>
              </div>
           </div>

          <div class="row">
            <div class="col-sm-12" *ngIf="!esServicio">
                <p>
                    <mat-form-field appearance="outline" style="width: 100%;" required>
                        <mat-label>Servicio</mat-label>
                        <input matInput type="text" placeholder="Servicio" id="precioC" formControlName="servicio" autocomplete="off" />
                    </mat-form-field>
                </p>
            </div>
          </div>

        </div>
     </div>
  </form>
</div>
<div style="display: flex; justify-content: center;" mat-dialog-actions>
  <button mat-stroked-button type="submit" (click)="actualizarForm()" class="aceptar">Actualizar</button>
  <button mat-stroked-button (click)="cancelar()" class="cancelar">Cancelar</button>
</div>
