<div class="custom-spinner-container" *ngIf="isLoading">
   <div class="custom-spinner">
       <div class="spinner-circle"></div>
       <div class="spinner-text">Cargando...</div>
   </div>
</div>
<div *ngIf="!isLoading">
   <div style="margin-top: 60px;">
      <div class="container mt-4">
        <ngx-spinner bdColor = "rgba(0, 0, 0, 0.8)" size = "medium" color = "#fff" type = "ball-pulse-sync" [fullScreen] = "true">
           <p style="color: white" > Cargando... </p>
        </ngx-spinner>
        <h2 class="mb-3">PLANES DISPONIBLES</h2>
        <div style="text-align: right;">
           <button mat-raised-button [disabled]="!habilitarBoton" style="background-color: #fd9727; font-size: 16px;" (click)="openDialog()">
              <mat-icon>add</mat-icon>
              AGREGAR PLAN
           </button>
        </div>
        <br/>
        <div style="margin-left: 70px;color:red;font-size: 20px;">{{message}}</div>
        <h3>Ingresa el valor de una columna</h3>
        <mat-form-field class="full-width">
           <mat-label>Filtro</mat-label>
           <input
           matInput
           (keyup)="applyFilter($event)"
           placeholder="Busca por columnas"
           #input
           />
        </mat-form-field>
        <div  class="table-container">
           <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
              <ng-container matColumnDef="title">
                 <th mat-header-cell *matHeaderCellDef>Título</th>
                 <td mat-cell *matCellDef="let item">{{ item.nombrePromocion }}</td>
              </ng-container>
              <ng-container matColumnDef="details">
                 <th mat-header-cell *matHeaderCellDef>Existencias</th>
                 <td mat-cell *matCellDef="let item">{{ item.existencias }}</td>
              </ng-container>
              <ng-container matColumnDef="price">
                 <th mat-header-cell *matHeaderCellDef>Precio</th>
                 <td mat-cell *matCellDef="let item">${{ item.PrecioPaquete }}</td>
              </ng-container>

              <ng-container matColumnDef="actions">
                 <th mat-header-cell *matHeaderCellDef>Acciones</th>
                 <td mat-cell *matCellDef="let item">
                    <button mat-icon-button color="primary" [disabled]="!habilitarBoton" (click)="openDialogEdit(item.id_promocion)">
                       <mat-icon>edit</mat-icon>
                    </button>

                    <div class="toggle-container">
                      <input type="checkbox" id="toggle{{item.id_promocion}}" class="toggle-checkbox" [checked]="item.estatus == 1" disabled>
                      <label for="toggle{{item.id_promocion}}" class="toggle-label"></label>
                   </div>

                    <button mat-icon-button color="warn" (click)="borrarPlan(item.id_promocion)">
                       <mat-icon>delete</mat-icon>
                       </button>
                 </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let item; columns: displayedColumns; let i = index"></tr>
           </table>
        </div>
        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
        <br/><br/>
      </div>
   </div>
</div>
