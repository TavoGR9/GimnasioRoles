<div class="custom-spinner-container" *ngIf="isLoading">
   <div class="custom-spinner">
       <div class="spinner-circle"></div>
       <div class="spinner-text">Cargando...</div>
   </div>
</div>
<!-- SUSTITUIR POR MARCAS -->
<div *ngIf="!isLoading">
  <div style="margin-top: 60px;">
     <div class="container mt-4">
     <h2 class="mb-3">SERVICIOS DISPONIBLES</h2>
     <div style="text-align: right;">
        <button [disabled]="!habilitarBoton" mat-flat-button style="background-color: #fd9727; font-size: 16px;" (click)="openDialogMar()">
           <mat-icon>add</mat-icon>
           AGREGAR SERVICIO
        </button>
     </div>
     <br/>
     <div style="margin-left: 70px;color:red;font-size: 20px;">{{message}}</div>
     <h3>Ingresa el valor de una columna</h3>
     <mat-form-field class="full-width">
        <mat-label>Filtro</mat-label>
        <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Busca por columnas"
        #input
        />
     </mat-form-field>
     <div  class="table-container">
        <table mat-table [dataSource]="dataSourceDos" class="mat-elevation-z8">
           <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef>Título</th>
              <td mat-cell *matCellDef="let item">{{ item.marca }}</td>
           </ng-container>
           <ng-container matColumnDef="details">
              <th mat-header-cell *matHeaderCellDef>Detalles</th>
              <td mat-cell *matCellDef="let item">{{ item.servicio == '1' ? 'Servicio' : '' }}</td>
            </ng-container>
           <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let item">
                 <button mat-icon-button color="primary" [disabled]="!habilitarBoton" (click)="editarMarcaSer(item.id_marcas)">
                    <mat-icon>edit</mat-icon>
                 </button>
              </td>
           </ng-container>

           <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
           <tr mat-row *matRowDef="let item; columns: displayedColumns; let i = index"></tr>
        </table>
     </div>
     <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
     </div>
  </div>
</div>
