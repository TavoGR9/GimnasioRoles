
<ngx-spinner bdColor = "rgba(0, 0, 0, 0.8)" size = "medium" color = "#fff" type = "ball-pulse-sync" [fullScreen] = "true">
  <p style="color: white" > Cargando... </p>
</ngx-spinner>
<div class="title" mat-dialog-title>
   <label >SERVICIOS</label>
</div>
<div mat-dialog-content>
  <form [formGroup]="serviceForm" >
     <br>
     <div>
        <div style="color:red">{{message}}</div>
        <div >
           <div class="row">
              <div class="col-sm-12">
                 <mat-form-field appearance="outline" style="width: 95%;">
                    <mat-label>Nombre del servicio</mat-label>
                    <input matInput formControlName="marcaP" placeholder="Nombre del servicio" />
                    <mat-error >
                       El nombre es requerido.
                    </mat-error>
                    <mat-error >
                       Solo se aceptan letras.
                    </mat-error>
                 </mat-form-field>
              </div>
              <!-- <div class="col-sm-6">
                <p>
                  <mat-form-field style="width: 95%;" required appearance="outline">
                      <mat-label style="font-family: Arial; font-size: 18px;">Seleccionar Si es Servicio</mat-label>
                      <mat-select formControlName="servicio" multiple="false" >
                          <mat-option  value="1">Si</mat-option>
                          <mat-option  value="0">No</mat-option>
                        </mat-select>
                      <mat-error >
                          La duracion es requerida.
                        </mat-error>
                  </mat-form-field>
                </p>
              </div> -->
           </div>
        </div>
     </div>
  </form>
</div>
<div style="display: flex; justify-content: center;" mat-dialog-actions>
  <!-- <button *ngIf="seleccionado == 1" mat-stroked-button type="submit" (click)="validaFormService()" class="aceptar">Aceptar</button>
  <button *ngIf="seleccionado == 2" mat-stroked-button type="submit" (click)="actualizarForm()" class="aceptar">Actualizar</button> -->
  <button mat-stroked-button type="submit" (click)="validaFormService()" class="aceptar">Aceptar</button>
  <button mat-stroked-button (click)="cancelar()" class="cancelar">Cancelar</button>
</div>
